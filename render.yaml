services:
  - type: web
    runtime: node
    name: krishimitra-2-0
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    disk:
      name: farmer-account-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: AUTH_DB_PATH
        value: /var/data/krishi-mitra.sqlite
      - key: GEMINI_API_KEY
        sync: false
